function RightFrameLoadEvent() {
    var rightFrame = document.getElementById('rightFrame');
    var iframeDocument = rightFrame.contentDocument || rightFrame.contentWindow.document;

    rightFrame.onload = updateUrl; // Update URL when iframe loads

    setTimeout(() => {
        try
        {
            var iframeDocument = rightFrame.contentDocument || rightFrame.contentWindow.document;
            if (iframeDocument) {
                iframeDocument.addEventListener('DOMContentLoaded', updateUrl); 
            }
        }
        catch(error){}
    }, 100);

        // Disconnect any previous observer before adding a new one
        if (rightFrame.observer) {
            rightFrame.observer.disconnect();
        }

        // Create a new MutationObserver
        var observer = new MutationObserver(function (mutationsList) {
            mutationsList.forEach(function (mutation) {

            });
        });

        var config = {
            childList: true,
            subtree: true,
            characterData: true
        };

        // Attach observer to the new document
        observer.observe(iframeDocument.body, config);

        // Store the observer to disconnect later if needed
        rightFrame.observer = observer;
    } else {

function findNodeByUrl(url) {
    try {
        var full_url = window.year + "/" + url;
        var tree = $.ui.fancytree.getTree("#tree");
        if (tree) {
            Promise.resolve().then(() => {
                var activeNode = tree.getActiveNode();
                // Check if the currently active node is already the desired node
                if (activeNode && activeNode.data.href === full_url) {
                    return; 
                }
                // Find the node only if it's not already selected
                var node = tree.findFirst(n => n.data.href === full_url);
                if (node) {
                    node.makeVisible().done(() => {
                        let parent = node.parent;
                        while (parent && !parent.isTopLevel()) {
                            if (!parent.expanded) {
                            parent.setExpanded(true, { noEvents: true });
                            }
                            parent = parent.parent;
                        }
                        node.setActive({ noEvents: true });
                        node.setFocus({ noEvents: true });
                        node.setExpanded(true, { noEvents: true });
                    });
                }
            });
        }
    } catch (error) {  }

<script>


async function checkUrlExists(url) {
    try {
        const response = await fetch(url, { method: 'HEAD' });
        if (response.ok) {
            return true; // URL exists
        } else {
            return false; // URL does not exist
        }
    } catch (error) {
        return false; // In case of network failure or fetch error
    }
}

function AssignLinksToButtons(cleanURL)
{
    const container = document.querySelector('.button-container');
    const buttons = container.querySelectorAll('button');
    buttons.forEach(function(button) {
         // Get the text of the button, which should be the year
         const year = button.textContent;
        let finalurl = year + "/" + cleanURL;
        //Set wrapper
        var linkWrap = button.closest('a');
        if (linkWrap) {
            linkWrap.setAttribute('href', year + ".htm?id=" + cleanURL);
        }
        if(year === window.year)
        {
            return;
        }
        //Set button redirection
        button.addEventListener('click', function() {
            window.location.href = year + ".htm?id=" + cleanURL
        });
        //Check if that year file exists
        try {
            fetchData(finalurl, button)  
        } catch (error) {}
    });
}

async function fetchData(finalurl, button) {
    const fileExists = await checkFileExists(finalurl);
    if (fileExists) {
        // File exists, set white button
        button.className = "standard-button";

    else
    {
        // File not found, set red button
        button.className = "invalid-button";
    }
}

function loadCookieToLocalStorage(key) {
    let cookies = document.cookie.split('; ');
    for (let cookie of cookies) {
        let [cookieKey, cookieValue] = cookie.split('=');
        if (cookieKey === key) {
            localStorage.setItem(key, decodeURIComponent(cookieValue));
            break;
        }
    }
}

function saveLocalStorageToCookie(key, days = 9999) {
    const value = localStorage.getItem(key);
    if (value) {
        const expires = new Date();
        expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${key}=${encodeURIComponent(value)}; expires=${expires.toUTCString()}; path=/`;
    }
}

// Function to render again the favs list
function renderSearchList(data) 
{

    const docSearchHit = createDocSearchHit(data, numberOfChildren, 0);
    outer_container.insertAdjacentElement('beforeend', docSearchHit);
}

// Retrieve recent searches from localStorage using the detected key
function getRecentSearches(key, limit = 99) {
    if (!key) return [];
    const stored = localStorage.getItem(key);
    if (!stored) return [];
    try {
        const parsed = JSON.parse(stored);
        // Depending on how DocSearch saves the data, it might be an array of objects.
        // If the value is an object (with extra metadata), try to extract an array.
        const items = Array.isArray(parsed) ? parsed : parsed.items || [];
        return items.slice(0, limit);
    } catch (e) {
        console.error("Error parsing recent searches from localStorage", e);
        return [];
    }
}

function removeSearchFromHistory(searchurl) 
{
    try
    {
        const key = key_rece; // The key used to store searches in localStorage
        const searches = JSON.parse(localStorage.getItem(key)) || [];
        const updatedSearches = searches.filter(search => search.url !== searchurl);
        localStorage.setItem(key, JSON.stringify(updatedSearches));
    }
    catch{ }
}

function removeFavoriteFromHistory(searchurl) {
    try
    {
        const key = key_fav; // The key used to store searches in localStorage
        const searches = JSON.parse(localStorage.getItem(key)) || [];
        const updatedSearches = searches.filter(search => search.url !== searchurl);
        localStorage.setItem(key, JSON.stringify(updatedSearches));
        saveLocalStorageToCookie(key_fav)
    }
    catch{ }
}

function addFavoriteToHistory(newSearch) {
    const key = key_fav; // Ensure this matches the key used in your remove function
    // Retrieve the existing searches array from local storage, or initialize it as an empty array if it doesn't exist
    const storedValue = localStorage.getItem(key);
    let searches = []
    if(storedValue && storedValue != "")
    {
        searches = JSON.parse(storedValue) || [];
    }
    // Add the new search to the array
    searches.push(newSearch);
    // Save the updated array back to local storage
    localStorage.setItem(key, JSON.stringify(searches));
    saveLocalStorageToCookie(key_fav)
}

    transformItems(items) {
        return items.map((item) => {
            const yearContent = item._highlightResult.year.value;

            if (!item._highlightResult || !item._highlightResult.tree_breakdown) {
                return { ...item, content: yearContent }; // Return empty content if missing properties
            }

            let treeBreakdown = item._highlightResult.tree_breakdown.value;

            treeBreakdown = treeBreakdown.replace(/Autodesk\.Revit\./g, "").trim();

            const newContent = treeBreakdown !== "" 
                ? `${yearContent} | ${treeBreakdown}` 
                : yearContent;

            return {
                ...item,
                content: newContent,
            };
        });
    },

    initialQuery: window.year + " ",
});
