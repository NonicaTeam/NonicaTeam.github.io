// Select the node that will be observed for mutations (e.g., the body)
const targetNode = document.body;

// Options for the observer (we're interested in child list changes and subtree modifications)
const config = { 
    childList: true,  // Detect addition/removal of <li> elements
    subtree: true,    // Observe all descendants of the parent element
};

let lastTimeout;
const key_fav  = "RevApiDocsFavorites" + window.index;
const key_rece = "__DOCSEARCH_RECENT_SEARCHES__" + window.index;

function loadCookieToLocalStorage(key) {
    let cookies = document.cookie.split('; ');
    for (let cookie of cookies) {
        let [cookieKey, cookieValue] = cookie.split('=');
        if (cookieKey === key) {
            localStorage.setItem(key, decodeURIComponent(cookieValue));
            break;
        }
    }
}

function saveLocalStorageToCookie(key, days = 9999) {
    const value = localStorage.getItem(key);
    if (value) {
        const expires = new Date();
        expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${key}=${encodeURIComponent(value)}; expires=${expires.toUTCString()}; path=/`;
    }
}

// Function to render again the favs list
function renderSearchList(data) 
{
    const outer_container = document.getElementById('container_favs'); // Ensure this element exists in your HTML
    const noFavsSubtitle = outer_container.querySelector("#SubtitleNoFavs");
    if(noFavsSubtitle)
    {
        noFavsSubtitle.remove()
    }
    const numberOfChildren = outer_container.childElementCount;
    const docSearchHit = createDocSearchHit(data, numberOfChildren, 0);
    outer_container.insertAdjacentElement('beforeend', docSearchHit);
}

// Retrieve recent searches from localStorage using the detected key
function getRecentSearches(key, limit = 99) {
    if (!key) return [];
    const stored = localStorage.getItem(key);
    if (!stored) return [];
    try {
        const parsed = JSON.parse(stored);
        // Depending on how DocSearch saves the data, it might be an array of objects.
        // If the value is an object (with extra metadata), try to extract an array.
        const items = Array.isArray(parsed) ? parsed : parsed.items || [];
        return items.slice(0, limit);
    } catch (e) {
        console.error("Error parsing recent searches from localStorage", e);
        return [];
    }
}

function removeSearchFromHistory(searchurl) 
{
    try
    {
        const key = key_rece; // The key used to store searches in localStorage
        const searches = JSON.parse(localStorage.getItem(key)) || [];
        const updatedSearches = searches.filter(search => search.url !== searchurl);
        localStorage.setItem(key, JSON.stringify(updatedSearches));
    }
    catch{ }
}

function removeFavoriteFromHistory(searchurl) {
    try
    {
        const key = key_fav; // The key used to store searches in localStorage
        const searches = JSON.parse(localStorage.getItem(key)) || [];
        const updatedSearches = searches.filter(search => search.url !== searchurl);
        localStorage.setItem(key, JSON.stringify(updatedSearches));
        saveLocalStorageToCookie(key_fav)
    }
    catch{ }
}

function addFavoriteToHistory(newSearch) {
    const key = key_fav; // Ensure this matches the key used in your remove function
    // Retrieve the existing searches array from local storage, or initialize it as an empty array if it doesn't exist
    const storedValue = localStorage.getItem(key);
    let searches = []
    if(storedValue && storedValue != "")
    {
        searches = JSON.parse(storedValue) || [];
    }
    // Add the new search to the array
    searches.push(newSearch);
    // Save the updated array back to local storage
    localStorage.setItem(key, JSON.stringify(searches));
    saveLocalStorageToCookie(key_fav)
}

function createDocSearchHit(data, index, favOrRec) {
    // Create list item
    const listItem = document.createElement('li');
    listItem.id = `docsearch-hits${index}-item-${index}`;
    listItem.role = 'option';
    listItem.setAttribute('aria-selected', 'true');
    listItem.classList.add('DocSearch-Hit');

    // Create anchor element
    const anchor = document.createElement('a');
    anchor.href = data.url;

    // Create container div
    const container = document.createElement('div');
    container.classList.add('DocSearch-Hit-Container');

    // Create icon div
    const iconDiv = document.createElement('div');
    iconDiv.classList.add('DocSearch-Hit-icon');
    if (favOrRec == 0)
    {
        const filledStar = `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 14.2L5 17l1-5.6-4-4 5.5-.7 2.5-5 2.5 5 5.6.8-4 4 .9 5.5z" stroke="currentColor" fill="white" fill-rule="evenodd" stroke-linejoin="round"></path></svg>`;
        iconDiv.innerHTML = filledStar;
    }
    else
    {
        const svgIcon = `<svg width="20" height="20" viewBox="0 0 20 20"><g stroke="currentColor" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round"><path d="M3.18 6.6a8.23 8.23 0 1112.93 9.94h0a8.23 8.23 0 01-11.63 0"></path><path d="M6.44 7.25H2.55V3.36M10.45 6v5.6M10.45 11.6L13 13"></path></g></svg>`;
        iconDiv.innerHTML = svgIcon;
    }

    // Create content wrapper div
    const contentWrapper = document.createElement('div');
    contentWrapper.classList.add('DocSearch-Hit-content-wrapper');
    const titleSpan = document.createElement('span');
    titleSpan.classList.add('DocSearch-Hit-title');
    titleSpan.textContent = data.hierarchy.lvl1;
    const pathSpan = document.createElement('span');
    pathSpan.classList.add('DocSearch-Hit-path');
    pathSpan.innerHTML = data.content.replace(/<mark[^>]*>|<\/mark>/g, '');; // Using innerHTML to preserve <mark> tags

    // Create the action div
    const actionDiv = document.createElement('div');
    actionDiv.classList.add('DocSearch-Hit-action');

    // Create the action div to add to favs
    const actionDiv2 = document.createElement('div');

    // Create the action button
    const button = document.createElement('button');
    button.type = 'submit';
    button.classList.add('DocSearch-Hit-action-button');
    const svgAction = `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 10l5.09-5.09L10 10l5.09 5.09L10 10zm0 0L4.91 4.91 10 10l-5.09 5.09L10 10z" stroke="currentColor" fill="none" fill-rule="evenodd" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
    button.innerHTML = svgAction;
    if(favOrRec == 0)
    {
        button.innerHTML = svgAction;
        button.title = 'Remove this favorite from history.';
        button.addEventListener('click', (event) => {
            event.preventDefault();
            removeFavoriteFromHistory(data.url);
            listItem.remove(); // Optionally remove the list item from the DOM
            const favcontainer = document.getElementById("container_favs"); 
            if (favcontainer.childElementCount === 0) 
            {
                const panelFavSubTitle = document.createElement('h5');
                panelFavSubTitle.id = "SubtitleNoFavs";
                panelFavSubTitle.style.whiteSpace = "pre-line";
                panelFavSubTitle.textContent = "⭐ No Favorites Marked.";
                panelFavSubTitle.style.padding = '10px';
                panelFavSubTitle.style.color = '#baaef9';
                favcontainer.appendChild(panelFavSubTitle);
            }
        });
    }
    else
    {
        button.title = 'Remove this search from history.';
        button.addEventListener('click', (event) => {
            event.preventDefault();
            removeSearchFromHistory(data.url);
            listItem.remove(); // Optionally remove the list item from the DOM
        });
        actionDiv2.classList.add('DocSearch-Hit-action');
        const buttonAddFavs = document.createElement('button');
        buttonAddFavs.id = "star_button";
        buttonAddFavs.title = 'Add this to favorites.';
        buttonAddFavs.type = 'submit';
        buttonAddFavs.classList.add('DocSearch-Hit-action-button');
        const svgAction = `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 14.2L5 17l1-5.6-4-4 5.5-.7 2.5-5 2.5 5 5.6.8-4 4 .9 5.5z" stroke="currentColor" fill="none" fill-rule="evenodd" stroke-linejoin="round"></path></svg>`;
        buttonAddFavs.innerHTML = svgAction;

        buttonAddFavs.addEventListener('click', (event) => {
            event.preventDefault();
            //Delete from Recent
            removeSearchFromHistory(data.url);
            listItem.remove(); // Optionally remove the list item from the DOM
            //Add to favs
            const extractedData = {
                url: data.url,
                content: data.content,
                hierarchy: {
                    lvl0: data.hierarchy.lvl0,
                    lvl1: data.hierarchy.lvl1
                },
            };
            addFavoriteToHistory(extractedData)
            renderSearchList(data)
        });

        actionDiv2.appendChild(buttonAddFavs);
    }
    actionDiv.appendChild(button);

    contentWrapper.appendChild(titleSpan);
    contentWrapper.appendChild(pathSpan);

    // Assemble the elements
    container.appendChild(iconDiv);
    container.appendChild(contentWrapper);
    if(favOrRec == 1)
    {
        container.appendChild(actionDiv2);
    }
    container.appendChild(actionDiv);
    anchor.appendChild(container);
    listItem.appendChild(anchor);

    return listItem;
}

function AddButtonToHtml(child)
{
    //Extract data from html
    const anchor = child.querySelector("a");
    const titleElement = child.querySelector(".DocSearch-Hit-title");
    const pathElement = child.querySelector(".DocSearch-Hit-path");
    const url = anchor ? anchor.href : "";
    const title = titleElement ? titleElement.textContent.trim() : "";
    let year = "";
    let treeBreakdown = "";
    let mycontent = "";
    if (pathElement) {
        const pathText = pathElement.textContent.trim();
        mycontent = pathText
        const pathParts = pathText.split("|");
        if (pathParts.length > 1) {
            year = pathParts[0].trim();
            treeBreakdown = pathParts[1].trim();
        }
    }
    const extractedData = {
        url: url,
        content: mycontent,
        hierarchy: {
            lvl0: year,
            lvl1: title
        },
    };
    //Create button and its structre
    // Create the outer div
    const div = document.createElement("div");
    div.id = "star_button"
    div.className = "DocSearch-Hit-action";
    // Create the button
    const button = document.createElement("button");
    button.title = "Save this search";
    button.type = "submit";
    button.className = "DocSearch-Hit-action-button";
    // Create the SVG element
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "20");
    svg.setAttribute("height", "20");
    svg.setAttribute("viewBox", "0 0 20 20");
    // Create the path inside the SVG
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M10 14.2L5 17l1-5.6-4-4 5.5-.7 2.5-5 2.5 5 5.6.8-4 4 .9 5.5z");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("fill", "none");
    path.setAttribute("fill-rule", "evenodd");
    path.setAttribute("stroke-linejoin", "round");

    // Append path to SVG
    svg.appendChild(path);

    button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        //Add to favs
        addFavoriteToHistory(extractedData)
        renderSearchList(extractedData)
    });

    // Append SVG to button
    button.appendChild(svg);

    // Append button to div
    div.appendChild(button);

    const containerElement = child.querySelector(".DocSearch-Hit-Container");
    containerElement.insertBefore(div, containerElement.lastElementChild);
}
